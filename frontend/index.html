<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaStream Player</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar: Navigation & Playlist -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-clapperboard"></i>
                    <span>CinemaStream</span>
                </div>
                <div class="movie-selector-wrapper">
                    <i class="fa-solid fa-film selector-icon"></i>
                    <select id="movie-selector" class="movie-selector">
                        <option value="" disabled selected>Select a Movie...</option>
                    </select>
                </div>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" placeholder="Search chapters..." autocomplete="off">
                <button id="clear-search" class="clear-search-btn" style="display: none;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="progress-section">
                <div class="progress-labels">
                    <span>Playlist Progress</span>
                    <span id="progress-text">0 / 0 Completed</span>
                </div>
                <div class="progress-bar-container">
                    <div id="playlist-progress-bar" class="progress-bar-fill" style="width: 0%;"></div>
                </div>
            </div>

            <nav class="playlist-container">
                <div id="playlist" class="playlist-items">
                    <!-- Dynamic playlist items go here -->
                    <div class="playlist-loading">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        <p>Loading playlist...</p>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- Main Content Area: Video Player & Controls -->
        <main class="main-content">
            <header class="main-header">
                <div class="current-track-info">
                    <span class="now-playing-label">Now Playing</span>
                    <h1 id="current-video-title">Select a Chapter</h1>
                </div>
                <div class="header-controls">
                    <label class="toggle-switch">
                        <input type="checkbox" id="autoplay-toggle" checked>
                        <span class="slider"></span>
                        <span class="toggle-label">Autoplay Next</span>
                    </label>
                </div>
            </header>

            <div class="player-wrapper">
                <div class="video-container">
                    <video id="video-player" playsinline>
                        Your browser does not support the video tag.
                    </video>
                    <!-- Custom Overlay Play Button (visible when paused) -->
                    <div id="video-overlay-play" class="video-overlay">
                        <div class="play-circle">
                            <i class="fa-solid fa-play"></i>
                        </div>
                    </div>
                </div>
                
                <!-- Custom Control Bar -->
                <div class="player-controls">
                    <div class="control-group">
                        <button id="prev-btn" class="control-btn" title="Previous Chapter (P)">
                            <i class="fa-solid fa-backward-step"></i>
                        </button>
                        <button id="play-btn" class="control-btn play-pause-btn" title="Play / Pause (Space)">
                            <i class="fa-solid fa-play"></i>
                        </button>
                        <button id="next-btn" class="control-btn" title="Next Chapter (N)">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                        
                        <div class="volume-container">
                            <button id="mute-btn" class="control-btn" title="Mute/Unmute">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8" class="volume-slider">
                        </div>

                        <div class="time-display">
                            <span id="current-time">0:00</span>
                            <span class="time-separator">/</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>

                    <div class="control-group right-controls">
                        <div class="speed-selector">
                            <button id="speed-btn" class="control-btn speed-btn">1.0x</button>
                            <div class="speed-menu" id="speed-menu">
                                <button class="speed-option" data-speed="0.5">0.5x</button>
                                <button class="speed-option active" data-speed="1.0">1.0x</button>
                                <button class="speed-option" data-speed="1.25">1.25x</button>
                                <button class="speed-option" data-speed="1.5">1.5x</button>
                                <button class="speed-option" data-speed="2.0">2.0x</button>
                            </div>
                        </div>
                        <button id="fullscreen-btn" class="control-btn" title="Fullscreen (F)">
                            <i class="fa-solid fa-expand"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Keyboard shortcuts help -->
            <footer class="player-footer">
                <div class="shortcuts-tip">
                    <span class="tip-title"><i class="fa-solid fa-keyboard"></i> Shortcuts:</span>
                    <span class="key">Space</span> play/pause &bull;
                    <span class="key">Left/Right Arrows</span> seek &bull;
                    <span class="key">Up/Down Arrows</span> volume &bull;
                    <span class="key">N</span> next &bull;
                    <span class="key">P</span> previous &bull;
                    <span class="key">F</span> fullscreen
                </div>
            </footer>
        </main>
    </div>

    <!-- Script -->
    <script src="/static/app.js"></script>
</body>
</html>
